<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Files - SilverFileSystem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
        }
        .header {
            background: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header .back { color: #667eea; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .header .back:hover { text-decoration: underline; }
        .controls {
            background: #1a1a1a; padding: 0.75rem 1rem; display: flex;
            gap: 0.75rem; align-items: center; flex-wrap: wrap;
            border-bottom: 1px solid #2a2a2a;
        }
        .controls label { font-size: 0.85rem; opacity: 0.7; }
        .controls input[type="number"] {
            width: 120px; padding: 0.4rem 0.6rem; background: #222;
            border: 1px solid #444; border-radius: 6px; color: white; font-size: 0.9rem;
        }
        .controls button {
            padding: 0.4rem 1rem; background: #667eea; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
        }
        .controls button:hover { background: #5568d3; }
        .container { padding: 1rem; max-width: 1400px; margin: 0 auto; }
        .stats-bar {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem; margin-bottom: 1rem;
        }
        .stat-card {
            background: #1a1a1a; border-radius: 10px; padding: 1rem;
            text-align: center; border: 1px solid #2a2a2a;
        }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 0.85rem; opacity: 0.6; margin-top: 0.25rem; }
        .group-card {
            background: #1a1a1a; border-radius: 10px; margin-bottom: 0.75rem;
            border: 1px solid #2a2a2a; overflow: hidden;
        }
        .group-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 1rem; cursor: pointer; transition: background 0.2s;
        }
        .group-header:hover { background: #222; }
        .group-info { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .group-badge {
            background: rgba(102,126,234,0.2); color: #667eea;
            padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;
        }
        .group-size { font-weight: 600; }
        .group-wasted { color: #e74c3c; font-weight: 600; }
        .group-toggle { font-size: 1.2rem; transition: transform 0.2s; }
        .group-toggle.open { transform: rotate(90deg); }
        .group-files { display: none; border-top: 1px solid #2a2a2a; }
        .group-files.open { display: block; }
        .file-row {
            display: flex; align-items: center; padding: 0.5rem 1rem;
            border-bottom: 1px solid #1f1f1f; font-size: 0.85rem; gap: 0.75rem;
        }
        .file-row:last-child { border-bottom: none; }
        .file-icon { font-size: 1.1rem; }
        .file-name { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-path { opacity: 0.5; font-size: 0.8rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; }
        .file-size { white-space: nowrap; font-weight: 500; }
        .file-ext {
            background: #333; padding: 0.15rem 0.4rem; border-radius: 3px;
            font-size: 0.75rem; opacity: 0.7; text-transform: uppercase;
        }
        .loading { text-align: center; padding: 3rem; opacity: 0.5; }
        .empty { text-align: center; padding: 3rem; opacity: 0.4; }
        .progress-bar {
            position: fixed; top: 0; left: 0; height: 3px; background: #667eea;
            z-index: 999; transition: width 0.3s; display: none;
        }
        @media (max-width: 768px) {
            .file-path { display: none; }
            .group-info { gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    <div class="header">
        <a href="/" class="back">Dashboard</a>
        <h1>🔍 Duplicate Files</h1>
        <a href="/duplicates/report" style="margin-left:auto; color:#667eea; text-decoration:none; font-size:0.9rem;">📊 Full Report</a>
    </div>
    <div class="controls">
        <label>Min Size:</label>
        <input type="number" id="minSize" value="0" min="0" placeholder="0 = all">
        <label>MB</label>
        <button onclick="loadDuplicates()">Search</button>
        <span id="statusText" style="opacity:0.5; font-size:0.85rem;"></span>
    </div>
    <div class="container">
        <div class="stats-bar" id="statsBar" style="display:none;">
            <div class="stat-card">
                <div class="stat-value" id="totalGroups">-</div>
                <div class="stat-label">Duplicate Groups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalFiles">-</div>
                <div class="stat-label">Duplicate Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalWasted">-</div>
                <div class="stat-label">Wasted Space</div>
            </div>
        </div>
        <div id="groupsContainer"><div class="empty">Set minimum file size and click Search</div></div>
    </div>

    <script src="/auth.js"></script>
    <script>
        function showLoading() {
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressBar').style.width = '70%';
        }
        function hideLoading() {
            document.getElementById('progressBar').style.width = '100%';
            setTimeout(() => { document.getElementById('progressBar').style.display = 'none'; }, 300);
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileIcon(ext) {
            if (!ext) return '📄';
            ext = ext.toLowerCase();
            if (['jpg','jpeg','png','gif','bmp','webp','heic'].includes(ext)) return '🖼️';
            if (['mp3','flac','wav','aac','ogg','m4a'].includes(ext)) return '🎵';
            if (['mp4','mkv','avi','mov','webm'].includes(ext)) return '🎬';
            if (['pdf','doc','docx','txt','md'].includes(ext)) return '📄';
            if (['zip','rar','7z','tar'].includes(ext)) return '📦';
            if (['safetensors','gguf','pt','ckpt','lora','onnx'].includes(ext)) return '🤖';
            if (['exe','msi','app'].includes(ext)) return '💻';
            return '📄';
        }

        async function loadDuplicates() {
            showLoading();
            const minSizeMB = parseInt(document.getElementById('minSize').value) || 0;
            const minSize = minSizeMB * 1024 * 1024;

            try {
                const res = await authFetch(`/api/duplicates?minSize=${minSize}&limit=100`);
                const data = await res.json();

                document.getElementById('totalGroups').textContent = data.totalGroups.toLocaleString();
                document.getElementById('totalFiles').textContent = data.totalFiles.toLocaleString();
                document.getElementById('totalWasted').textContent = data.totalWastedFormatted;
                document.getElementById('statsBar').style.display = '';

                const container = document.getElementById('groupsContainer');

                if (!data.groups || data.groups.length === 0) {
                    container.innerHTML = '<div class="empty">No duplicate files found</div>';
                    hideLoading();
                    return;
                }

                document.getElementById('statusText').textContent = `Showing ${data.groups.length} of ${data.totalGroups} groups`;

                container.innerHTML = data.groups.map((group, i) => {
                    const filesHtml = group.files.map(f => `
                        <div class="file-row">
                            <span class="file-icon">${getFileIcon(f.extension)}</span>
                            <span class="file-name" title="${f.path}">${f.name}</span>
                            <span class="file-path">${f.path}</span>
                            <span class="file-ext">${f.extension || '?'}</span>
                            <span class="file-size">${f.sizeFormatted}</span>
                        </div>
                    `).join('');

                    return `
                        <div class="group-card">
                            <div class="group-header" onclick="toggleGroup(${i})">
                                <div class="group-info">
                                    <span class="group-badge">${group.count} copies</span>
                                    <span class="group-size">${group.sizeFormatted} each</span>
                                    <span class="group-wasted">⚠ ${group.wastedFormatted} wasted</span>
                                </div>
                                <span class="group-toggle" id="toggle-${i}">▶</span>
                            </div>
                            <div class="group-files" id="files-${i}">${filesHtml}</div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                document.getElementById('groupsContainer').innerHTML =
                    `<div class="empty">Error: ${err.message}</div>`;
            }
            hideLoading();
        }

        function toggleGroup(index) {
            const files = document.getElementById(`files-${index}`);
            const toggle = document.getElementById(`toggle-${index}`);
            files.classList.toggle('open');
            toggle.classList.toggle('open');
        }

        // Auto-load on page load
        loadDuplicates();
    </script>
</body>
</html>
