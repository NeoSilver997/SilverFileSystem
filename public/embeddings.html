<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embedding Review · SilverFileSystem</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1f2b; --text:#e8eaed; --muted:#9aa0a6; --accent:#9b59b6; --ok:#2ecc71; --bad:#e74c3c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid #2a3142; background:#12161f; position:sticky; top:0; z-index:5; }
    header h1 { font-size:1.1rem; margin:0; font-weight:600; }
    header a { color:#8ab4f8; text-decoration:none; margin-right:0.75rem; }
    input, select, button { background:#222938; color:var(--text); border:1px solid #3a4358; border-radius:6px; padding:0.45rem 0.7rem; }
    button { cursor:pointer; background:rgba(155,89,182,0.35); border-color:rgba(155,89,182,0.6); }
    button:hover { filter:brightness(1.1); }
    .meta { color:var(--muted); font-size:0.85rem; }
    main { padding:1rem 1.25rem 2rem; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
    th, td { padding:0.55rem 0.7rem; border-bottom:1px solid #2a3142; text-align:left; font-size:0.9rem; vertical-align:middle; }
    th { background:#151a24; color:var(--muted); font-weight:600; position:sticky; top:64px; }
    tr:hover td { background:#1f2633; }
    .thumb { width:56px; height:56px; object-fit:cover; border-radius:6px; background:#111; }
    .badge { display:inline-block; padding:0.15rem 0.45rem; border-radius:999px; font-size:0.75rem; }
    .badge.ok { background:rgba(46,204,113,0.2); color:var(--ok); }
    .badge.miss { background:rgba(231,76,60,0.2); color:var(--bad); }
    .badge.cat { background:rgba(155,89,182,0.25); color:#d7b6ef; }
    button.secondary { background:rgba(138,180,248,0.2); border-color:rgba(138,180,248,0.5); }
    tr.hidden { display:none; }
    #counts { margin:0.35rem 0 0.75rem; display:flex; flex-wrap:wrap; gap:0.4rem; }
    #counts .chip { background:#222938; border:1px solid #3a4358; border-radius:999px; padding:0.2rem 0.55rem; font-size:0.8rem; cursor:pointer; }
    #counts .chip.active { border-color:var(--accent); color:#d7b6ef; }
    .path { font-family: ui-monospace, Consolas, monospace; font-size:0.8rem; color:var(--muted); word-break:break-all; }
    #status { margin:0.75rem 0; }
    #taxonomy { margin:0.5rem 0 1rem; padding:0.75rem 1rem; background:var(--card); border-radius:10px; border:1px solid #2a3142; font-size:0.85rem; }
    #taxonomy h2 { margin:0 0 0.4rem; font-size:0.95rem; font-weight:600; }
    #taxonomy .kw { color:var(--muted); }
    #taxonomy code { background:#222938; padding:0.1rem 0.35rem; border-radius:4px; font-size:0.8rem; }
  </style>
</head>
<body>
  <header>
    <a href="/tree">← Tree</a>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/jobs">Jobs</a>
    <h1>🧬 Embedding 檢視 / Embedding Review</h1>
    <input id="folderPath" style="min-width:320px; flex:1;" placeholder="Folder path e.g. D:\Phone\16G\DCIM\103OLYMP" />
    <input id="folderId" style="width:110px;" placeholder="folderId" />
    <select id="modelFilter">
      <option value="">All models</option>
      <option value="embeddinggemma-2">embeddinggemma-2</option>
    </select>
    <select id="categoryFilter" title="Filter by embedding category">
      <option value="">All categories</option>
    </select>
    <button onclick="loadEmbeddings()">Load</button>
    <button class="secondary" onclick="warmThumbs()" title="Generate DB thumbnails for this folder">Warm thumbs</button>
    <button onclick="classifyFolder(false)" title="Cosine vs text prototypes">Classify by embedding</button>
    <button class="secondary" onclick="classifyFolder(true)" title="Reclassify all">Force reclassify</button>
  </header>
  <main>
    <div id="jobProgressHost"></div>
    <div id="status" class="meta">Open from /tree with ?path= or ?folderId=, or paste a path and Load.</div>
    <div class="path" id="folderLabel"></div>
    <div id="taxonomy" class="meta">Loading category list…</div>
    <div id="counts"></div>
    <table>
      <thead>
        <tr>
          <th>Thumb</th>
          <th>Filename</th>
          <th>Model</th>
          <th>Dims</th>
          <th>Category</th>
          <th>Score</th>
          <th>Updated</th>
          <th>DB Thumb</th>
          <th>Size</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>
  <script src="/auth.js"></script>
  <script src="/job-progress.js"></script>
  <script>
    let lastRows = [];
    let KNOWN_CATS = ['人物單人','人物合照','風景','動物','食物','收據餐牌資料','螢幕截圖','其他'];
    let taxonomyMeta = null;

    async function loadTaxonomy() {
      const box = document.getElementById('taxonomy');
      if (!box) return;
      try {
        const data = await api('/api/embed/categories');
        taxonomyMeta = data;
        const cats = data.categories || [];
        KNOWN_CATS = (data.labels && data.labels.length) ? data.labels : KNOWN_CATS;
        const lines = cats.map(c => {
          const kws = (c.keywords || []).slice(0, 8).join(' · ');
          return '<div><span class="badge cat">' + c.label + '</span> <span class="kw">' + (kws || '(no keywords)') + '</span></div>';
        });
        if (data.otherLabel) {
          lines.push('<div><span class="badge miss">' + data.otherLabel + '</span> <span class="kw">score &lt; minScore (' + (data.minScore ?? '-') + ')</span></div>');
        }
        const extras = data.suggestedExtras || [];
        const extraHtml = extras.length
          ? ('<div style="margin-top:0.55rem"><strong>建議額外（未啟用）</strong> — copy into <code>categories</code> in JSON to enable<br>' +
             extras.map(e => '<span class="badge miss">' + e.label + '</span> <span class="kw">' + ((e.keywords||[]).slice(0,6).join(' · ')) + '</span>').join('<br>') +
             '</div>')
          : '';
        const pathHint = data.configPath
          ? ('Edit keywords in <code>' + data.configPath + '</code> then Force reclassify (or GET ?refresh=1). Env: <code>EMBED_CATEGORIES_PATH</code>')
          : 'Config: config/embed-categories.json';
        box.innerHTML = '<h2>分類類型 / Categories</h2>' + lines.join('') + extraHtml + '<div style="margin-top:0.5rem">' + pathHint + '</div>';
      } catch (err) {
        box.innerHTML = 'Category list unavailable: ' + err.message + ' · Edit <code>config/embed-categories.json</code>';
      }
    }

    function qs(name) {
      return new URLSearchParams(location.search).get(name);
    }
    function fmtBytes(n) {
      if (n == null) return '-';
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
      return (n/1048576).toFixed(2) + ' MB';
    }
    function fmtTime(v) {
      if (!v) return '-';
      try { return new Date(v).toLocaleString('zh-HK', { hour12: false }); } catch { return String(v); }
    }
    function fmtScore(v) {
      if (v == null || Number.isNaN(Number(v))) return '-';
      return Number(v).toFixed(3);
    }
    async function api(url, opts) {
      const r = await fetch(url, { credentials: 'include', ...opts, headers: { 'Content-Type': 'application/json', ...(opts && opts.headers || {}) } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }
    function fillCategoryFilter(counts) {
      const sel = document.getElementById('categoryFilter');
      if (!sel) return;
      const cur = sel.value;
      const labels = new Set(KNOWN_CATS);
      Object.keys(counts || {}).forEach(k => labels.add(k));
      sel.innerHTML = '<option value="">All categories</option>';
      [...labels].forEach(lab => {
        const opt = document.createElement('option');
        opt.value = lab;
        const n = counts && counts[lab] ? ' (' + counts[lab] + ')' : '';
        opt.textContent = lab + n;
        sel.appendChild(opt);
      });
      if (cur) sel.value = cur;
    }
    function renderCounts(counts) {
      const el = document.getElementById('counts');
      if (!el) return;
      el.innerHTML = '';
      const entries = Object.entries(counts || {}).sort((a,b) => b[1]-a[1]);
      if (!entries.length) return;
      const all = document.createElement('span');
      all.className = 'chip' + (!(document.getElementById('categoryFilter') || {}).value ? ' active' : '');
      all.textContent = 'ALL';
      all.onclick = () => { document.getElementById('categoryFilter').value = ''; applyFilter(); renderCounts(counts); };
      el.appendChild(all);
      for (const [k,v] of entries) {
        const chip = document.createElement('span');
        chip.className = 'chip' + (document.getElementById('categoryFilter').value === k ? ' active' : '');
        chip.textContent = k + ' · ' + v;
        chip.onclick = () => { document.getElementById('categoryFilter').value = k; applyFilter(); renderCounts(counts); };
        el.appendChild(chip);
      }
    }
    function applyFilter() {
      const cat = (document.getElementById('categoryFilter') || {}).value || '';
      document.querySelectorAll('#tbody tr').forEach(tr => {
        const rowCat = tr.getAttribute('data-category') || '';
        tr.classList.toggle('hidden', !!(cat && rowCat !== cat));
      });
    }
    function renderRows(data) {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      lastRows = data.embeddings || [];
      fillCategoryFilter(data.categoryCounts || {});
      renderCounts(data.categoryCounts || {});
      for (const row of lastRows) {
        const emb = row.embedding;
        const tr = document.createElement('tr');
        tr.setAttribute('data-category', row.category || '');
        const thumbUrl = '/images/' + row.fileId + '/thumb';
        const catHtml = row.category
          ? '<span class="badge cat">' + row.category + '</span>'
          : '<span class="badge miss">unclassified</span>';
        tr.innerHTML =
          '<td><img class="thumb" src="' + thumbUrl + '" alt="" loading="lazy" onerror="this.style.opacity=0.2" /></td>' +
          '<td><div>' + (row.name || '') + '</div><div class="path">id=' + row.fileId + '</div></td>' +
          '<td>' + (emb ? emb.model : '<span class="badge miss">missing</span>') + '</td>' +
          '<td>' + (emb ? emb.dims : '-') + '</td>' +
          '<td>' + catHtml + '</td>' +
          '<td>' + fmtScore(row.categoryScore) + '</td>' +
          '<td>' + (emb ? fmtTime(emb.updatedAt) : '-') + '</td>' +
          '<td>' + (row.hasThumbnail ? '<span class="badge ok">yes</span>' : '<span class="badge miss">no</span>') + '</td>' +
          '<td>' + fmtBytes(row.size) + '</td>';
        tbody.appendChild(tr);
      }
      applyFilter();
    }
    async function loadEmbeddings() {
      const status = document.getElementById('status');
      const folderId = document.getElementById('folderId').value.trim() || qs('folderId') || qs('id');
      const folderPath = document.getElementById('folderPath').value.trim() || qs('path') || qs('folderPath');
      const model = document.getElementById('modelFilter').value;
      if (!folderId && !folderPath) {
        status.textContent = 'Need folderId or folder path';
        return;
      }
      if (folderPath) document.getElementById('folderPath').value = folderPath;
      if (folderId) document.getElementById('folderId').value = folderId;
      status.textContent = 'Loading...';
      try {
        const params = new URLSearchParams();
        if (folderId) params.set('folderId', folderId);
        if (folderPath) params.set('folderPath', folderPath);
        if (model) params.set('model', model);
        const data = await api('/api/embed/folder?' + params.toString());
        document.getElementById('folderLabel').textContent = '#' + data.folderId + '  ' + (data.path || '');
        const classified = data.classified != null ? data.classified : (data.embeddings || []).filter(e => e.category).length;
        status.textContent = 'Indexed ' + data.indexed + ' / ' + data.total + ' · Classified ' + classified;
        renderRows(data);
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      }
    }
    async function runFolderJob(url, body, label) {
      const status = document.getElementById('status');
      const host = document.getElementById('jobProgressHost');
      status.textContent = label + ' — enqueue…';
      const data = await api(url, { method: 'POST', body: JSON.stringify(body) });
      if (!data.jobId) throw new Error('No jobId returned');
      status.textContent = label + ' job #' + data.jobId.slice(0, 8) + ' — running…';
      const finalJob = await JobProgress.poll(data.jobId, { host, intervalMs: 500 });
      const r = finalJob.result || {};
      const parts = [];
      if (r.indexed != null) parts.push('indexed=' + r.indexed);
      if (r.classified != null) parts.push('classified=' + r.classified);
      if (r.generated != null) parts.push('generated=' + r.generated);
      if (r.skipped != null) parts.push('skipped=' + r.skipped);
      if (r.failed != null) parts.push('failed=' + r.failed);
      if (r.missingEmbed != null) parts.push('missingEmbed=' + r.missingEmbed);
      if (r.categoryCounts) parts.push(Object.entries(r.categoryCounts).map(([k,v]) => k + '=' + v).join(', '));
      const review = ' · <a href="' + JobProgress.resultUrl(data.jobId) + '">Review result</a>';
      if (finalJob.status === 'error' || finalJob.status === 'cancelled') {
        status.innerHTML = label + ' ' + finalJob.status + ': ' + (finalJob.error || finalJob.message || '') + review;
      } else {
        status.innerHTML = label + ' done: ' + (parts.join(' ') || finalJob.message || 'ok') + review;
      }
      return finalJob;
    }
    async function warmThumbs() {
      const status = document.getElementById('status');
      const folderId = document.getElementById('folderId').value.trim() || qs('folderId');
      const folderPath = document.getElementById('folderPath').value.trim() || qs('path');
      if (!folderId && !folderPath) { status.textContent = 'Need folder first'; return; }
      try {
        await runFolderJob('/api/thumbs/folder', { folderId: folderId || undefined, folderPath: folderPath || undefined, force: false }, 'Thumbs');
        await loadEmbeddings();
      } catch (err) {
        status.textContent = 'Warm failed: ' + err.message;
      }
    }
    async function classifyFolder(force) {
      const status = document.getElementById('status');
      const folderId = document.getElementById('folderId').value.trim() || qs('folderId');
      const folderPath = document.getElementById('folderPath').value.trim() || qs('path');
      if (!folderId && !folderPath) { status.textContent = 'Need folder first'; return; }
      try {
        await runFolderJob('/api/embed/classify-folder', {
          folderId: folderId || undefined,
          folderPath: folderPath || undefined,
          force: !!force
        }, force ? 'Force classify' : 'Classify');
        await loadEmbeddings();
      } catch (err) {
        status.textContent = 'Classify failed: ' + err.message;
      }
    }
    const catSel = document.getElementById('categoryFilter');
    if (catSel) catSel.addEventListener('change', applyFilter);
    (function init() {
      const p = qs('path') || qs('folderPath');
      const id = qs('folderId') || qs('id');
      if (p) document.getElementById('folderPath').value = p;
      if (id) document.getElementById('folderId').value = id;
      loadTaxonomy();
      if (p || id) loadEmbeddings();
    })();
  </script>
</body>
</html>
