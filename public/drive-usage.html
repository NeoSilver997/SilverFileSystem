<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Usage History - SilverFileSystem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; }
        .header { background: linear-gradient(135deg, #141e30 0%, #243b55 100%); padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header .back { color: #667eea; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .container { padding: 1rem; max-width: 1400px; margin: 0 auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
        .stat-card { background: #1a1a1a; border-radius: 10px; padding: 1rem; border: 1px solid #2a2a2a; cursor: pointer; transition: border-color 0.2s; }
        .stat-card:hover { border-color: #667eea; }
        .stat-card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .stat-card h3 a { color: #667eea; text-decoration: none; }
        .stat-card h3 a:hover { text-decoration: underline; }
        .stat-row { display: flex; justify-content: space-between; margin: 0.25rem 0; font-size: 0.85rem; }
        .stat-row .label { opacity: 0.6; }
        .progress-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
        .progress-fill { height: 100%; border-radius: 4px; }
        .progress-ok { background: linear-gradient(90deg, #27ae60, #2ecc71); }
        .progress-warn { background: linear-gradient(90deg, #f39c12, #e67e22); }
        .progress-danger { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .section { background: #1a1a1a; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; border: 1px solid #2a2a2a; }
        .section h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
        .loading { text-align: center; padding: 3rem; opacity: 0.5; }
        .filter-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.3rem 0.7rem; border-radius: 4px; border: 1px solid #444; background: #333; color: white; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .filter-btn.active { border-color: currentColor; }
        .filter-btn.all-btn { color: #aaa; }
        .filter-btn.all-btn.active { background: #555; border-color: #888; }
        canvas { width: 100%; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back">Dashboard</a>
        <h1>💾 Drive Usage History</h1>
        <button onclick="manualCheck()" style="margin-left:auto;padding:0.4rem 0.8rem;background:rgba(102,126,234,0.3);border:1px solid rgba(102,126,234,0.5);color:white;border-radius:6px;cursor:pointer;font-size:0.85rem;">🔄 Check Now</button>
    </div>
    <div class="container">
        <div id="content"><div class="loading">Loading drive usage...</div></div>
    </div>

    <script src="/auth.js"></script>
    <script>
        let allHistory = [];
        let allDrives = [];
        let activeDrives = new Set();
        const driveColors = {};

        function getDriveColor(drv, i) {
            const palette = ['#667eea','#27ae60','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db','#e91e63','#00bcd4'];
            return palette[i % palette.length];
        }

        function formatBytes(b) {
            if (!b || b === 0) return '0 B';
            const k = 1024, s = ['B','KB','MB','GB','TB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return (b / Math.pow(k, i)).toFixed(2) + ' ' + s[i];
        }

        function getPercentClass(pct) {
            if (pct >= 90) return 'progress-danger';
            if (pct >= 70) return 'progress-warn';
            return 'progress-ok';
        }

        async function loadUsage() {
            try {
                const res = await authFetch('/api/drive-usage?days=365');
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                allHistory = data.history;
                allDrives = [...new Set(data.history.map(h => h.drive))];
                allDrives.forEach((d, i) => {
                    driveColors[d] = getDriveColor(d, i);
                    activeDrives.add(d);
                });
                renderUsage(data);
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="loading">Error: ${err.message}</div>`;
            }
        }

        function toggleDrive(drv) {
            if (drv === 'ALL') {
                if (activeDrives.size === allDrives.length) {
                    activeDrives.clear();
                } else {
                    allDrives.forEach(d => activeDrives.add(d));
                }
            } else {
                if (activeDrives.has(drv)) activeDrives.delete(drv);
                else activeDrives.add(drv);
            }
            renderChart();
            renderFilters();
        }

        function renderFilters() {
            const el = document.getElementById('filterBar');
            if (!el) return;
            let html = `<button class="filter-btn all-btn ${activeDrives.size === allDrives.length ? 'active' : ''}" onclick="toggleDrive('ALL')">All</button>`;
            for (const drv of allDrives) {
                const active = activeDrives.has(drv);
                html += `<button class="filter-btn ${active ? 'active' : ''}" style="color:${driveColors[drv]};${active ? `background:${driveColors[drv]}22;border-color:${driveColors[drv]}` : ''}" onclick="toggleDrive('${drv}')">${drv}</button>`;
            }
            el.innerHTML = html;
        }

        function renderUsage(data) {
            const { latest } = data;
            let html = '';

            // Current usage cards
            html += '<div class="stats-grid">';
            for (const d of latest) {
                const pct = d.total_bytes > 0 ? ((d.used_bytes / d.total_bytes) * 100).toFixed(1) : 0;
                html += `<div class="stat-card" onclick="window.location.href='/tree?path=${d.drive}'">
                    <h3><a href="/tree?path=${d.drive}" onclick="event.stopPropagation()">${d.drive}</a></h3>
                    <div class="stat-row"><span class="label">Total:</span><span>${formatBytes(d.total_bytes)}</span></div>
                    <div class="stat-row"><span class="label">Used:</span><span>${formatBytes(d.used_bytes)}</span></div>
                    <div class="stat-row"><span class="label">Free:</span><span>${formatBytes(d.free_bytes)}</span></div>
                    <div class="progress-bar"><div class="progress-fill ${getPercentClass(pct)}" style="width:${pct}%"></div></div>
                    <div style="text-align:center;font-size:0.8rem;margin-top:0.3rem;opacity:0.7;">${pct}% used</div>
                </div>`;
            }
            html += '</div>';

            // Charts
            if (allDrives.length > 0) {
                html += '<div class="section"><h2>📈 Free Space History (Stacked)</h2>';
                html += '<div class="filter-bar" id="filterBar"></div>';
                html += '<canvas id="freeChart" height="280"></canvas>';
                html += '</div>';
                html += '<div class="section"><h2>📊 Used Space History (Stacked)</h2>';
                html += '<canvas id="usedChart" height="280"></canvas>';
                html += '</div>';
            }

            if (allHistory.length === 0) {
                html += '<div class="section"><p style="opacity:0.5;">No history data yet. Click "Check Now" or wait for the hourly job.</p></div>';
            }

            document.getElementById('content').innerHTML = html;
            renderFilters();
            if (allDrives.length > 0) {
                drawStackChart('freeChart', 'free_bytes');
                drawStackChart('usedChart', 'used_bytes');
            }
        }

        function renderChart() {
            drawStackChart('freeChart', 'free_bytes');
            drawStackChart('usedChart', 'used_bytes');
        }

        function getChartData(metric) {
            const visibleDrives = allDrives.filter(d => activeDrives.has(d));
            const byDayDrive = {};
            const allDays = new Set();
            for (const h of allHistory) {
                if (!activeDrives.has(h.drive)) continue;
                const day = new Date(h.recorded_at).toISOString().slice(0, 10);
                allDays.add(day);
                if (!byDayDrive[day]) byDayDrive[day] = {};
                byDayDrive[day][h.drive] = h;
            }
            const days = [...allDays].sort();
            let maxStack = 0;
            for (const day of days) {
                let stack = 0;
                for (const drv of visibleDrives) {
                    if (byDayDrive[day] && byDayDrive[day][drv]) {
                        stack += byDayDrive[day][drv][metric] || 0;
                    }
                }
                maxStack = Math.max(maxStack, stack);
            }
            return { days, visibleDrives, byDayDrive, maxStack: maxStack || 1 };
        }

        function drawStackChart(canvasId, metric) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = 280 * dpr;
            canvas.style.height = '280px';
            ctx.scale(dpr, dpr);

            const W = rect.width;
            const H = 280;
            const pad = { top: 30, right: 20, bottom: 40, left: 70 };
            const chartW = W - pad.left - pad.right;
            const chartH = H - pad.top - pad.bottom;

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, W, H);

            const { days, visibleDrives, byDayDrive, maxStack } = getChartData(metric);

            if (days.length === 0 || visibleDrives.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('No data — toggle drives on', W / 2, H / 2);
                return;
            }

            // Grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + (chartH / 4) * i;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(W - pad.right, y);
                ctx.stroke();
                const val = maxStack - (maxStack / 4) * i;
                ctx.fillStyle = '#888';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'right';
                ctx.fillText(formatBytes(val), pad.left - 8, y + 4);
            }

            // Stacked bars
            const barW = Math.max(2, Math.min(20, chartW / days.length - 2));
            for (let i = 0; i < days.length; i++) {
                const x = pad.left + (i / days.length) * chartW + (chartW / days.length - barW) / 2;
                let stackY = pad.top + chartH;

                for (const drv of visibleDrives) {
                    const entry = byDayDrive[days[i]] && byDayDrive[days[i]][drv];
                    if (!entry) continue;
                    const val = entry[metric] || 0;
                    const barH = (val / maxStack) * chartH;
                    stackY -= barH;

                    ctx.fillStyle = driveColors[drv] + 'CC';
                    ctx.fillRect(x, stackY, barW, barH);
                    ctx.strokeStyle = driveColors[drv];
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x, stackY, barW, barH);
                }

                // X labels
                if (days.length <= 30 || i % Math.ceil(days.length / 15) === 0) {
                    ctx.fillStyle = '#888';
                    ctx.font = '9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.save();
                    ctx.translate(x + barW / 2, H - pad.bottom + 12);
                    ctx.rotate(-0.5);
                    ctx.fillText(days[i].slice(5), 0, 0);
                    ctx.restore();
                }
            }

            // Legend
            let lx = pad.left;
            ctx.font = '11px sans-serif';
            for (const drv of visibleDrives) {
                ctx.fillStyle = driveColors[drv];
                ctx.fillRect(lx, 8, 12, 12);
                ctx.fillStyle = '#aaa';
                ctx.textAlign = 'left';
                ctx.fillText(drv, lx + 16, 18);
                lx += ctx.measureText(drv).width + 30;
            }
        }

        window.addEventListener('resize', () => {
            if (allHistory.length) {
                drawStackChart('freeChart', 'free_bytes');
                drawStackChart('usedChart', 'used_bytes');
            }
        });

        async function manualCheck() {
            try {
                document.getElementById('content').innerHTML = '<div class="loading">Checking drives...</div>';
                const res = await authFetch('/api/drive-usage/check', { method: 'POST' });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                loadUsage();
            } catch (err) {
                alert('Check failed: ' + err.message);
                loadUsage();
            }
        }

        loadUsage();
    </script>
</body>
</html>
