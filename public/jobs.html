<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobs · SilverFileSystem</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1f2b; --text:#e8eaed; --muted:#9aa0a6; --accent:#9b59b6; --ok:#2ecc71; --bad:#e74c3c; --warn:#f39c12; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid #2a3142; background:#12161f; position:sticky; top:0; z-index:5; }
    header h1 { font-size:1.1rem; margin:0; font-weight:600; }
    header a { color:#8ab4f8; text-decoration:none; margin-right:0.75rem; }
    select, button { background:#222938; color:var(--text); border:1px solid #3a4358; border-radius:6px; padding:0.45rem 0.7rem; cursor:pointer; }
    button.primary { background:rgba(155,89,182,0.35); border-color:rgba(155,89,182,0.6); }
    button.danger { background:rgba(231,76,60,0.25); border-color:rgba(231,76,60,0.5); }
    main { display:grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr); gap:1rem; padding:1rem 1.25rem 2rem; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .panel { background:var(--card); border-radius:10px; border:1px solid #2a3142; overflow:hidden; }
    .panel h2 { margin:0; padding:0.75rem 1rem; font-size:0.95rem; background:#151a24; border-bottom:1px solid #2a3142; }
    .job-row { padding:0.7rem 1rem; border-bottom:1px solid #2a3142; cursor:pointer; }
    .job-row:hover, .job-row.active { background:#1f2633; }
    .job-row .t { font-weight:600; font-size:0.9rem; }
    .job-row .m { color:var(--muted); font-size:0.8rem; margin-top:0.2rem; }
    .badge { display:inline-block; padding:0.1rem 0.45rem; border-radius:999px; font-size:0.72rem; margin-left:0.35rem; }
    .badge.queued { background:rgba(243,156,18,0.2); color:var(--warn); }
    .badge.running { background:rgba(138,180,248,0.25); color:#8ab4f8; }
    .badge.done { background:rgba(46,204,113,0.2); color:var(--ok); }
    .badge.error, .badge.cancelled { background:rgba(231,76,60,0.2); color:var(--bad); }
    #detail { padding:1rem; }
    .meta { color:var(--muted); font-size:0.85rem; }
    .path { font-family: ui-monospace, Consolas, monospace; font-size:0.8rem; color:var(--muted); word-break:break-all; }
    pre { background:#12161f; border:1px solid #2a3142; border-radius:8px; padding:0.75rem; overflow:auto; max-height:420px; font-size:0.78rem; }
    .summary { display:flex; flex-wrap:wrap; gap:0.5rem; margin:0.75rem 0; }
    .chip { background:#222938; border:1px solid #3a4358; border-radius:999px; padding:0.25rem 0.6rem; font-size:0.8rem; }
    table { width:100%; border-collapse:collapse; font-size:0.82rem; }
    th, td { padding:0.35rem 0.5rem; border-bottom:1px solid #2a3142; text-align:left; }
    th { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <a href="/tree">← Tree</a>
    <a href="/embeddings">Embeddings</a>
    <h1>⚙ Jobs queue / 結果檢視</h1>
    <select id="statusFilter">
      <option value="">All status</option>
      <option value="queued,running">Active</option>
      <option value="done">Done</option>
      <option value="error">Error</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <label style="display:flex;align-items:center;gap:0.35rem;font-size:0.85rem;color:var(--muted);cursor:pointer">
      <input type="checkbox" id="showOlder" /> Show older than 3 days
    </label>
    <button onclick="loadList()">Refresh</button>
  </header>
  <main>
    <section class="panel">
      <h2>Queue</h2>
      <div id="list"><div class="job-row meta">Loading…</div></div>
    </section>
    <section class="panel">
      <h2>Detail / Result review</h2>
      <div id="detail" class="meta">Select a job, or open with ?id=</div>
    </section>
  </main>
  <script src="/auth.js"></script>
  <script src="/job-progress.js"></script>
  <script>
    let selectedId = null;
    let pollTimer = null;

    function qs(name) { return new URLSearchParams(location.search).get(name); }
    async function api(url, opts) {
      const r = await fetch(url, { credentials: 'include', ...opts, headers: { 'Content-Type': 'application/json', ...(opts && opts.headers || {}) } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
      return data;
    }
    function fmtTime(v) {
      if (!v) return '-';
      try { return new Date(v).toLocaleString('zh-HK', { hour12: false }); } catch { return String(v); }
    }
    function badge(status) {
      return '<span class="badge ' + (status || '') + '">' + (status || '?') + '</span>';
    }

    async function loadList() {
      const status = document.getElementById('statusFilter').value;
      const showOlder = document.getElementById('showOlder')?.checked;
      const params = new URLSearchParams({ limit: '80', maxAgeDays: '3' });
      if (status) params.set('status', status);
      if (showOlder) params.set('includeOlder', '1');
      else params.set('includeOlder', '0');
      try {
        const data = await api('/api/jobs?' + params.toString());
        const el = document.getElementById('list');
        if (!data.jobs || !data.jobs.length) {
          el.innerHTML = '<div class="job-row meta">No jobs yet. Start Classify / Warm thumbs / Embed folder.</div>';
          return;
        }
        el.innerHTML = data.jobs.map(j => {
          const meta = j.meta || {};
          const label = meta.path || meta.folderPath || (meta.folderId ? ('folder #' + meta.folderId) : '');
          return '<div class="job-row' + (j.id === selectedId ? ' active' : '') + '" data-id="' + j.id + '" onclick="selectJob(\'' + j.id + '\')">' +
            '<div class="t">' + (j.type || 'job') + badge(j.status) + '</div>' +
            '<div class="m">' + (j.percent || 0) + '% · ' + (j.message || '') + (label ? (' · ' + label) : '') + '</div>' +
            '<div class="m">' + fmtTime(j.createdAt) + ' · #' + j.id.slice(0, 8) + '</div>' +
          '</div>';
        }).join('');
      } catch (err) {
        document.getElementById('list').innerHTML = '<div class="job-row meta">Error: ' + err.message + '</div>';
      }
    }

    function summarizeResult(job) {
      const r = job.result || {};
      const chips = [];
      if (r.total != null) chips.push('total=' + r.total);
      if (r.indexed != null) chips.push('indexed=' + r.indexed);
      if (r.classified != null) chips.push('classified=' + r.classified);
      if (r.generated != null) chips.push('generated=' + r.generated);
      if (r.skipped != null) chips.push('skipped=' + r.skipped);
      if (r.failed != null) chips.push('failed=' + r.failed);
      if (r.missingEmbed != null) chips.push('missingEmbed=' + r.missingEmbed);
      if (r.totals) {
        if (r.totals.exif != null) chips.push('exif=' + r.totals.exif);
        if (r.totals.created != null) chips.push('created=' + r.totals.created);
        if (r.totals.missingFile != null) chips.push('missingFile=' + r.totals.missingFile);
        if (r.totals.offline != null) chips.push('offline=' + r.totals.offline);
      }
      if (r.doneThisRun != null) chips.push('doneThisRun=' + r.doneThisRun);
      if (r.remainingAtStart != null) chips.push('remainingAtStart=' + r.remainingAtStart);
      if (r.categoryCounts) {
        Object.entries(r.categoryCounts).forEach(([k, v]) => chips.push(k + '=' + v));
      }
      return chips;
    }

    function renderDetail(job) {
      const host = document.getElementById('detail');
      const meta = job.meta || {};
      const chips = summarizeResult(job);
      const results = (job.result && job.result.results) || [];
      const errRows = results.filter(x => x.status === 'error' || x.status === 'missing' || x.status === 'missing-embedding' || x.status === 'missing-db' || x.status === 'no-hash');
      let html = '';
      html += '<div><strong>' + job.type + '</strong> ' + badge(job.status) + '</div>';
      html += '<div class="path">id=' + job.id + '</div>';
      html += '<div class="meta">created ' + fmtTime(job.createdAt) + ' · started ' + fmtTime(job.startedAt) + ' · finished ' + fmtTime(job.finishedAt) + '</div>';
      if (meta.path || meta.folderPath) html += '<div class="path">' + (meta.path || meta.folderPath) + '</div>';
      if (meta.folderId) html += '<div class="meta">folderId=' + meta.folderId + '</div>';
      html += '<div id="progHost"></div>';
      html += '<div class="summary">' + chips.map(c => '<span class="chip">' + c + '</span>').join('') + '</div>';
      html += '<div class="meta">' + (job.message || '') + (job.error ? (' · <span style="color:var(--bad)">' + job.error + '</span>') : '') + '</div>';
      if (job.status === 'queued' || job.status === 'running') {
        html += '<p><button class="danger" onclick="cancelSelected()">Cancel</button></p>';
      }
      if (meta.folderId) {
        html += '<p><a href="/embeddings?folderId=' + meta.folderId + '">Open embeddings review →</a></p>';
      }
      if (errRows.length) {
        html += '<h3 style="font-size:0.9rem;margin:1rem 0 0.4rem">Errors / missing (' + errRows.length + ')</h3>';
        html += '<table><thead><tr><th>File</th><th>Status</th><th>Error</th></tr></thead><tbody>';
        errRows.slice(0, 50).forEach(row => {
          html += '<tr><td>' + (row.name || row.id) + '</td><td>' + row.status + '</td><td>' + (row.error || '') + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      if (results.length) {
        html += '<h3 style="font-size:0.9rem;margin:1rem 0 0.4rem">Per-file results (' + results.length + ')</h3>';
        html += '<pre>' + JSON.stringify(results.slice(0, 80), null, 2) + (results.length > 80 ? '\n… +' + (results.length - 80) + ' more' : '') + '</pre>';
      } else if (job.result) {
        html += '<h3 style="font-size:0.9rem;margin:1rem 0 0.4rem">Raw result</h3>';
        html += '<pre>' + JSON.stringify(job.result, null, 2) + '</pre>';
      }
      host.innerHTML = html;
      const wrap = JobProgress.ensureBar(document.getElementById('progHost'));
      JobProgress.setBar(wrap, job);
    }

    async function selectJob(id) {
      selectedId = id;
      const url = new URL(location.href);
      url.searchParams.set('id', id);
      history.replaceState(null, '', url);
      await loadList();
      await refreshDetail();
    }

    async function refreshDetail() {
      if (!selectedId) return;
      try {
        const job = await api('/api/jobs/' + encodeURIComponent(selectedId));
        renderDetail(job);
        if (pollTimer) clearTimeout(pollTimer);
        if (job.status === 'queued' || job.status === 'running') {
          pollTimer = setTimeout(refreshDetail, 500);
        }
      } catch (err) {
        document.getElementById('detail').textContent = 'Error: ' + err.message;
      }
    }

    async function cancelSelected() {
      if (!selectedId) return;
      if (!confirm('Cancel this job?')) return;
      try {
        await api('/api/jobs/' + encodeURIComponent(selectedId) + '/cancel', { method: 'POST', body: '{}' });
        await refreshDetail();
        await loadList();
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById('statusFilter').addEventListener('change', loadList);
    document.getElementById('showOlder').addEventListener('change', loadList);
    (async function init() {
      await loadList();
      const id = qs('id');
      if (id) selectJob(id);
      setInterval(loadList, 4000);
    })();
  </script>
</body>
</html>
