<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Library - SilverFileSystem</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header .back { color: white; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; padding: 0.5rem; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; }
        .stat-card { text-align: center; padding: 0.25rem; }
        .stat-number { font-size: 1.5rem; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 0.8rem; color: #888; margin-top: 0.2rem; }
        .controls { background: #1a1a1a; padding: 0.5rem; border-bottom: 1px solid #2a2a2a; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
        .search-box { flex: 1; min-width: 200px; }
        .search-box input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #444; border-radius: 6px; background: #222; color: white; font-size: 0.9rem; }
        .search-box input:focus { outline: none; border-color: #667eea; }
        .filter-group { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }
        .filter-label { font-weight: 600; color: #aaa; font-size: 0.8rem; }
        select.filter-btn { padding: 0.4rem 0.6rem; border: 1px solid #444; background: #222; color: white; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .view-toggle { display: flex; gap: 0.3rem; }
        .view-btn { padding: 0.4rem 0.8rem; border: 1px solid #444; background: #222; color: white; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .view-btn.active { background: #667eea; border-color: #667eea; }
        .dup-toggle { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: #aaa; cursor: pointer; }
        .dup-toggle input { cursor: pointer; }
        .container { padding: 0.5rem; max-width: 1600px; margin: 0 auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.5rem; }
        .photo-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2a2a; }
        .photo-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-color: #667eea; }
        .photo-thumbnail { width: 100%; aspect-ratio: 1; background: #222; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .photo-info { padding: 0.5rem; }
        .photo-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.25rem; }
        .photo-meta { font-size: 0.75rem; color: #888; display: flex; flex-direction: column; gap: 0.15rem; }
        .photo-badge { display: inline-block; padding: 0.1rem 0.3rem; background: rgba(102,126,234,0.2); color: #667eea; border-radius: 3px; font-size: 0.7rem; margin-right: 0.2rem; }
        .loading { text-align: center; padding: 3rem; opacity: 0.5; }
        .no-results { text-align: center; padding: 3rem; opacity: 0.5; }
        /* Map view */
        .gallery-map { display: grid; grid-template-columns: 300px 1fr; gap: 0.5rem; height: 70vh; }
        .map-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0.3rem; }
        .map-photo-card { background: #1a1a1a; border-radius: 6px; padding: 0.5rem; cursor: pointer; border: 1px solid #2a2a2a; display: flex; gap: 0.5rem; align-items: center; }
        .map-photo-card:hover, .map-photo-card.selected { border-color: #667eea; background: #222; }
        .map-photo-card img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .map-photo-card .info { flex: 1; min-width: 0; }
        .map-photo-card .name { font-size: 0.8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .map-photo-card .loc { font-size: 0.7rem; color: #888; }
        #leafletMap { width: 100%; height: 100%; border-radius: 8px; }
        /* Lightbox / Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { display: flex; max-width: 95vw; max-height: 95vh; gap: 1rem; }
        .modal-image-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; position: relative; }
        .modal-image-wrap img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; }
        .modal-sidebar { width: 320px; background: #1a1a1a; border-radius: 8px; padding: 1rem; overflow-y: auto; flex-shrink: 0; }
        .modal-sidebar h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #667eea; }
        .modal-meta-row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; }
        .modal-meta-row .label { color: #888; }
        .modal-meta-row .value { color: #e0e0e0; text-align: right; max-width: 60%; word-break: break-all; }
        .modal-close { position: fixed; top: 15px; right: 20px; font-size: 2rem; color: white; cursor: pointer; background: rgba(0,0,0,0.5); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10001; }
        .modal-nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 2rem; color: white; cursor: pointer; background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10001; }
        .modal-nav.prev { left: 15px; }
        .modal-nav.next { right: 340px; }
        .modal-delete { margin-top: 1rem; padding: 0.5rem; background: rgba(231,76,60,0.2); color: #e74c3c; border: 1px solid rgba(231,76,60,0.4); border-radius: 6px; cursor: pointer; font-size: 0.85rem; width: 100%; text-align: center; }
        .modal-delete:hover { background: rgba(231,76,60,0.4); }
        .modal-nav-btns { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 10001; }
        .modal-nav-btns button { padding: 0.5rem 1.5rem; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .modal-nav-btns button:hover { background: rgba(255,255,255,0.1); }
        @media (max-width: 900px) {
            .modal-content { flex-direction: column; }
            .modal-sidebar { width: 100%; max-height: 40vh; }
            .modal-nav.next { right: 15px; top: auto; bottom: 80px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .gallery-map { grid-template-columns: 1fr; grid-template-rows: 1fr 200px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back">Dashboard</a>
        <h1>📷 Photo Library</h1>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat-card"><div class="stat-number" id="totalPhotos">-</div><div class="stat-label">Photos</div></div>
        <div class="stat-card"><div class="stat-number" id="totalSize">-</div><div class="stat-label">Size</div></div>
        <div class="stat-card"><div class="stat-number" id="uniqueCameras">-</div><div class="stat-label">Cameras</div></div>
        <div class="stat-card"><div class="stat-number" id="withGPS">-</div><div class="stat-label">With GPS</div></div>
        <div class="stat-card"><div class="stat-number" id="hiddenCount">-</div><div class="stat-label">Hidden</div></div>
    </div>

    <div class="controls">
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search photos by name, camera, or semantic query..."></div>
        <div class="filter-group">
            <select id="searchMode" class="filter-btn" onchange="loadPhotos()" title="Search mode">
                <option value="name">Name search</option>
                <option value="embed">Embedding search</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="cameraFilter" class="filter-btn" onchange="loadPhotos()"><option value="">All Cameras</option></select>
        </div>
        <div class="filter-group">
            <select id="yearFilter" class="filter-btn" onchange="loadPhotos()"><option value="">All Years</option></select>
        </div>
        <div class="filter-group">
            <select id="monthFilter" class="filter-btn" onchange="loadPhotos()">
                <option value="">All Months</option>
                <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
                <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
                <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
                <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="daysFilter" class="filter-btn" onchange="loadPhotos()">
                <option value="7" selected>Last 7 days</option>
                <option value="1">1 day</option><option value="3">3 days</option>
                <option value="30">30 days</option><option value="90">90 days</option>
                <option value="365">1 year</option><option value="0">All time</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="modelFilter" class="filter-btn" onchange="loadPhotos()"><option value="">All Models</option></select>
        </div>
        <div class="filter-group">
            <select id="faceFilter" class="filter-btn" onchange="loadPhotos()"><option value="">All Faces</option></select>
        </div>
        <div class="filter-group">
            <select id="tagFilter" class="filter-btn" onchange="loadPhotos()"><option value="">All Tags</option></select>
        </div>
        <div class="filter-group">
            <select id="embedFilter" class="filter-btn" onchange="loadPhotos()">
                <option value="">All Embed</option>
                <option value="1">Has Embedding</option>
                <option value="0">No Embedding</option>
            </select>
        </div>
        <label class="dup-toggle"><input type="checkbox" id="hideOffline" checked onchange="loadPhotos()"> Hide Offline</label>
                <label class="dup-toggle"><input type="checkbox" id="minSizeOn" checked onchange="localStorage.setItem('photosMinSizeOn', this.checked?'1':'0'); loadPhotos()"> Hide &lt;</label><input type="number" id="minSizeKB" min="0" step="10" value="200" style="width:70px" onkeydown="if(event.key==='Enter'){clearTimeout(window._msT);saveMinSize();loadPhotos();}" oninput="clearTimeout(window._msT);window._msT=setTimeout(function(){saveMinSize();loadPhotos();},600)"> KB
        <span style="position:relative;display:inline-block;"><button id="hiddenFoldersBtn" onclick="toggleHiddenFoldersPanel(event)" style="padding:0.4rem 0.8rem;background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:4px;cursor:pointer;font-size:0.8rem;">Hidden folders (0)</button><div id="hiddenFoldersPanel" style="display:none;position:absolute;z-index:2000;top:110%;left:0;min-width:360px;max-width:600px;max-height:360px;overflow:auto;background:#1a1a1a;border:1px solid #444;border-radius:6px;padding:0.5rem;box-shadow:0 4px 16px rgba(0,0,0,0.6);"></div></span>
        <label class="dup-toggle"><input type="checkbox" id="hideDuplicates" checked onchange="loadPhotos()"> Hide Duplicates</label>
        <button onclick="deleteAllDuplicates()" style="padding:0.4rem 0.8rem;background:rgba(231,76,60,0.2);color:#e74c3c;border:1px solid rgba(231,76,60,0.4);border-radius:4px;cursor:pointer;font-size:0.8rem;">🗑 Delete All Duplicates</button>
        <div class="view-toggle">
            <button class="view-btn active" data-view="grid">Grid</button>
            <button class="view-btn" data-view="map">Map</button>
        </div>
    </div>

    <div class="container"><div id="photoContainer" class="gallery-grid"><div class="loading">Loading photos...</div></div></div>

    <!-- Modal / Lightbox -->
    <div id="photoModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal-close" onclick="closeModal()">×</div>
        <div class="modal-nav prev" onclick="navigateModal(-1)">‹</div>
        <div class="modal-nav next" onclick="navigateModal(1)">›</div>
        <div class="modal-content">
            <div class="modal-image-wrap"><img id="modalImage" src="" alt=""></div>
            <div class="modal-sidebar" id="modalSidebar"></div>
        </div>
        <div class="modal-nav-btns">
            <button onclick="navigateModal(-1)">‹ Prev</button>
            <span id="modalCounter" style="padding:0.5rem 1rem;color:#aaa;">1 / 1</span>
            <button onclick="navigateModal(1)">Next ›</button>
        </div>
    </div>

    <script src="/auth.js"></script>
    <script>
        let allPhotosData = [];
        let allPhotos = [];
        let currentView = 'grid';
        let currentModalIndex = 0;
        let searchTimeout = null;
        let currentPage = 1;
        const ITEMS_PER_PAGE = 100;
        let leafletMap = null;
        let leafletMarkers = [];
        let allHiddenPhotos = [];

        function getCookie(name) { const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)'); return m ? m.pop() : null; }
        function setCookie(name, val, days) { const d = new Date(); d.setTime(d.getTime()+days*86400000); document.cookie = name+'='+val+';expires='+d.toUTCString()+';path=/;SameSite=Lax'; }
        function formatBytes(b) { if (!b) return '0 B'; const k=1024,s=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(b)/Math.log(k)); return (b/Math.pow(k,i)).toFixed(1)+' '+s[i]; }
        function formatDate(d) { if (!d) return 'N/A'; return new Date(d).toLocaleString(); }

        async function authFetch(url, opts={}) {
            const token = getCookie('silverfs_token');
            if (!token) { document.getElementById('loginOverlay')&&(document.getElementById('loginOverlay').style.display='flex'); throw new Error('Not authenticated'); }
            opts.headers = opts.headers||{}; opts.headers['Authorization'] = 'Bearer '+token;
            const res = await fetch(url, opts);
            if (res.status===401) throw new Error('Session expired');
            return res;
        }

        async function loadPhotos() {
            const container = document.getElementById('photoContainer');
            try {
                const params = new URLSearchParams();
                const search = document.getElementById('searchInput').value;
                const searchMode = document.getElementById('searchMode')?.value || 'name';
                const camera = document.getElementById('cameraFilter').value;
                const model = document.getElementById('modelFilter').value;
                const year = document.getElementById('yearFilter').value;
                const month = document.getElementById('monthFilter').value;
                const days = document.getElementById('daysFilter').value;
                if (search) {
                    if (searchMode === 'embed') params.append('embedQuery', search);
                    else params.append('search', search);
                }
                if (camera) params.append('camera', camera);
                if (model) params.append('model', model);
                if (year) params.append('year', year);
                if (month) params.append('month', month);
                if (days) params.append('days', days);
                const face = document.getElementById('faceFilter').value;
                if (face) params.append('face', face);
                const tag = document.getElementById('tagFilter').value;
                if (tag) params.append('tag', tag);
                const embedF = document.getElementById('embedFilter')?.value || '';
                if (embedF !== '') params.append('hasEmbedding', embedF);
                const hideOffline = document.getElementById('hideOffline').checked;
                params.append('hideOffline', hideOffline ? '1' : '0');
const minOnEl = document.getElementById('minSizeOn'), minKbEl = document.getElementById('minSizeKB');
if (minOnEl && !minOnEl.dataset.init) { localStorage.removeItem('photosHideSmall'); minOnEl.checked = localStorage.getItem('photosMinSizeOn') !== '0'; const sv = localStorage.getItem('photosMinSizeKB'); if (sv !== null && sv !== '') minKbEl.value = sv; minOnEl.dataset.init = '1'; }
if (minOnEl && minOnEl.checked) { const kb = parseFloat(minKbEl.value); if (isFinite(kb) && kb > 0) params.append('minSize', String(Math.round(kb * 1024))); }

                const hf = getHiddenFolders(); updateHiddenFoldersBtn();
                if (hf.length) params.append('excludeFolders', JSON.stringify(hf));
                const res = await authFetch('/api/photos?'+params);
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                document.getElementById('totalPhotos').textContent = data.stats.totalPhotos;
                document.getElementById('totalSize').textContent = data.stats.totalSize;
                document.getElementById('uniqueCameras').textContent = data.stats.uniqueCameras;
                document.getElementById('withGPS').textContent = data.stats.withGPS;

                if (data.filters) {
                    const camSelect = document.getElementById('cameraFilter');
                    const curCam = camSelect.value;
                    camSelect.innerHTML = '<option value="">All Cameras</option>' + data.filters.cameras.map(c => `<option value="${c.name}" ${c.name===curCam?'selected':''}>${c.name} (${c.count.toLocaleString()})</option>`).join('');
                    const modelSelect = document.getElementById('modelFilter');
                    const curModel = modelSelect.value;
                    modelSelect.innerHTML = '<option value="">All Models</option>' + data.filters.models.map(m => `<option value="${m.name}" ${m.name===curModel?'selected':''}>${m.name} (${m.count.toLocaleString()})</option>`).join('');
                    const yearSelect = document.getElementById('yearFilter');
                    const curYear = yearSelect.value;
                    yearSelect.innerHTML = '<option value="">All Years</option>' + data.filters.years.map(y => `<option value="${y}" ${String(y)===curYear?'selected':''}>${y}</option>`).join('');
                }

                allPhotosData = data.photos;
                allPhotos = data.photos;

                if (document.getElementById('hideDuplicates').checked) {
                    allPhotos = allPhotosData.filter(p => !p.is_duplicate);
                } else {
                    allPhotos = allPhotosData;
                }

                const hideCount = allPhotosData.length - allPhotos.length;
                const offlineN = data.offlineSkipped || 0;
                document.getElementById('hiddenCount').textContent = hideCount.toLocaleString() + (offlineN ? ` (+${offlineN.toLocaleString()} offline)` : '') + ((data.folderSkipped||0) ? ` (+${data.folderSkipped.toLocaleString()} folder)` : '');

                if (currentView === 'map') { renderMapView(); } else { renderGrid(true); }
            } catch (err) {
                container.innerHTML = `<div class="no-results">Error: ${err.message}</div>`;
            }
        }

        function renderGrid(reset=false) {
            if (reset) currentPage = 1;
            const container = document.getElementById('photoContainer');
            container.className = 'gallery-grid';
            const start = (currentPage-1)*ITEMS_PER_PAGE;
            const page = allPhotos.slice(start, start+ITEMS_PER_PAGE);

            if (page.length === 0) { container.innerHTML = '<div class="no-results">No photos found</div>'; return; }

            container.innerHTML = page.map((photo, i) => {
                const gi = start + i;
                return `<div class="photo-card" onclick="openModal(${gi})">
                    <div class="photo-thumbnail"><img src="/images/${photo.id}/thumb" alt="${photo.name}" loading="lazy" onerror="this.src='/images/${photo.id}';this.onerror=null;"></div>
                    <div class="photo-info">
                        <div class="photo-name" title="${photo.path||photo.name}">${photo.name}</div>
                        <div class="photo-meta">
                            <div>${photo.width||0}×${photo.height||0} • ${formatBytes(photo.size)}</div>
                            ${photo.camera_make?`<div>📸 ${photo.camera_make} ${photo.camera_model||''}</div>`:''}
                            ${photo.date_taken?`<div>📅 ${formatDate(photo.date_taken)}</div>`:''}
                            ${photo.latitude?`<span class="photo-badge">📍 GPS</span>`:''}
                            ${photo.hasEmbedding?`<span class="photo-badge" style="background:rgba(46,204,113,0.2);color:#2ecc71;">Embed${photo.embedScore!=null?' '+Number(photo.embedScore).toFixed(2):''}</span>`:''}
                            ${(photo.tags&&photo.tags.length)?photo.tags.map(t=>`<span class="photo-badge" style="background:rgba(102,126,234,0.25);color:#aab6ff;">🏷 ${t.label}${t.score!=null?' '+Number(t.score).toFixed(2):''}</span>`).join(''):(photo.category?`<span class="photo-badge" style="background:rgba(102,126,234,0.25);color:#aab6ff;">🏷 ${photo.category}${photo.category2?' · '+photo.category2:''}</span>`:'')}
                            <button onclick="event.stopPropagation();hideFolderOf(${gi})" title="隱藏此資料夾" style="margin-top:0.3rem;padding:0.15rem 0.4rem;background:rgba(255,255,255,0.08);color:#bbb;border:1px solid #444;border-radius:3px;cursor:pointer;font-size:0.7rem;">隱藏此資料夾</button>
                            ${photo.is_duplicate?`<span class="photo-badge" style="background:rgba(231,76,60,0.2);color:#e74c3c;">⚠ Dup</span>`:''}
                        </div>
                    </div>
                </div>`;
            }).join('');

            const totalPages = Math.ceil(allPhotos.length/ITEMS_PER_PAGE);
            if (totalPages > 1) {
                container.innerHTML += `<div style="grid-column:1/-1;text-align:center;padding:1rem;">
                    <div style="display:inline-flex;gap:0.3rem;align-items:center;background:#1a1a1a;padding:0.5rem;border-radius:8px;border:1px solid #2a2a2a;">
                        <button onclick="goPage(1)" ${currentPage===1?'disabled':''} style="padding:0.4rem 0.7rem;background:${currentPage===1?'#333':'#667eea'};color:${currentPage===1?'#666':'white'};border:none;border-radius:4px;cursor:pointer;">First</button>
                        <button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''} style="padding:0.4rem 0.7rem;background:${currentPage===1?'#333':'#667eea'};color:${currentPage===1?'#666':'white'};border:none;border-radius:4px;cursor:pointer;">‹</button>
                        <span style="padding:0.4rem 0.8rem;color:#aaa;font-size:0.85rem;">${currentPage}/${totalPages}</span>
                        <button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''} style="padding:0.4rem 0.7rem;background:${currentPage===totalPages?'#333':'#667eea'};color:${currentPage===totalPages?'#666':'white'};border:none;border-radius:4px;cursor:pointer;">›</button>
                        <button onclick="goPage(${totalPages})" ${currentPage===totalPages?'disabled':''} style="padding:0.4rem 0.7rem;background:${currentPage===totalPages?'#333':'#667eea'};color:${currentPage===totalPages?'#666':'white'};border:none;border-radius:4px;cursor:pointer;">Last</button>
                    </div>
                    <div style="margin-top:0.3rem;color:#666;font-size:0.8rem;">${start+1}-${Math.min(start+ITEMS_PER_PAGE,allPhotos.length)} of ${allPhotos.length.toLocaleString()}</div>
                </div>`;
            }
        }

        function getHiddenFolders() { try { const a = JSON.parse(localStorage.getItem('photosHiddenFolders')||'[]'); return Array.isArray(a) ? a.filter(x => typeof x === 'string' && x) : []; } catch (e) { return []; } }
        function setHiddenFolders(a) { localStorage.setItem('photosHiddenFolders', JSON.stringify(a)); updateHiddenFoldersBtn(); }
        function folderOfPath(p) { const s = String(p||''); const i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/')); return i > 0 ? s.slice(0, i) : ''; }
        function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function hideFolderOf(idx) {
            const photo = allPhotos[idx]; if (!photo) return;
            const folder = folderOfPath(photo.path);
            if (!folder) { alert('搵唔到呢張相嘅資料夾路徑'); return; }
            if (!confirm('隱藏呢個資料夾（包括子資料夾）嘅所有相？\n' + folder)) return;
            const a = getHiddenFolders();
            if (!a.some(x => x.toLowerCase() === folder.toLowerCase())) a.push(folder);
            setHiddenFolders(a);
            if (document.getElementById('photoModal').classList.contains('active')) closeModal();
            loadPhotos();
        }
        function updateHiddenFoldersBtn() { const b = document.getElementById('hiddenFoldersBtn'); if (b) b.textContent = 'Hidden folders (' + getHiddenFolders().length + ')'; renderHiddenFoldersPanel(); }
        function renderHiddenFoldersPanel() {
            const p = document.getElementById('hiddenFoldersPanel'); if (!p) return;
            const a = getHiddenFolders();
            p.innerHTML = a.length ? a.map((f, i) => '<div style="display:flex;gap:0.4rem;align-items:center;padding:0.2rem 0;border-bottom:1px solid #2a2a2a;"><span style="flex:1;font-size:0.75rem;color:#ccc;word-break:break-all;">' + escHtml(f) + '</span><button onclick="unhideFolder(' + i + ')" style="padding:0.1rem 0.4rem;font-size:0.7rem;cursor:pointer;">顯示返</button></div>').join('') + '<div style="text-align:right;margin-top:0.4rem;"><button onclick="clearHiddenFolders()" style="padding:0.2rem 0.6rem;font-size:0.75rem;cursor:pointer;">全部清除</button></div>' : '<div style="color:#888;font-size:0.8rem;">冇隱藏資料夾</div>';
        }
        function toggleHiddenFoldersPanel(ev) { if (ev) ev.stopPropagation(); const p = document.getElementById('hiddenFoldersPanel'); renderHiddenFoldersPanel(); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
        function unhideFolder(i) { const a = getHiddenFolders(); a.splice(i, 1); setHiddenFolders(a); loadPhotos(); }
        function clearHiddenFolders() { if (!confirm('清除所有隱藏資料夾？')) return; setHiddenFolders([]); loadPhotos(); }
        document.addEventListener('click', function (e) { const p = document.getElementById('hiddenFoldersPanel'); if (p && p.style.display !== 'none' && !p.contains(e.target) && e.target.id !== 'hiddenFoldersBtn') p.style.display = 'none'; });

        function goPage(p) { const tp=Math.ceil(allPhotos.length/ITEMS_PER_PAGE); if(p>=1&&p<=tp){currentPage=p;renderGrid(false);window.scrollTo({top:0,behavior:'smooth'});} }

        function renderMapView() {
            const container = document.getElementById('photoContainer');
            container.className = '';
            const gpsPhotos = allPhotos.filter(p => p.latitude && p.longitude);
            if (gpsPhotos.length === 0) { container.innerHTML = '<div class="no-results">No photos with GPS data</div>'; return; }

            container.innerHTML = `<div class="gallery-map"><div class="map-list" id="mapList"></div><div id="leafletMap"></div></div>`;

            // Init Leaflet map
            if (leafletMap) { leafletMap.remove(); leafletMap = null; }
            leafletMap = L.map('leafletMap').setView([parseFloat(gpsPhotos[0].latitude), parseFloat(gpsPhotos[0].longitude)], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(leafletMap);

            leafletMarkers = [];
            gpsPhotos.forEach((photo, i) => {
                const marker = L.marker([parseFloat(photo.latitude), parseFloat(photo.longitude)]).addTo(leafletMap);
                marker.bindPopup(`<img src="/images/${photo.id}/thumb" style="width:150px;border-radius:4px;" onclick="openModal(${allPhotos.indexOf(photo)})"><br><b>${photo.name}</b><br>${formatDate(photo.date_taken)}`);
                marker.on('click', () => highlightMapItem(i));
                leafletMarkers.push(marker);
            });

            const bounds = L.latLngBounds(gpsPhotos.map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]));
            leafletMap.fitBounds(bounds, { padding: [20, 20] });

            const mapList = document.getElementById('mapList');
            mapList.innerHTML = gpsPhotos.map((photo, i) => `
                <div class="map-photo-card" id="mcard-${i}" onclick="focusMapPhoto(${i})">
                    <img src="/images/${photo.id}/thumb" loading="lazy" onerror="this.src='/images/${photo.id}';this.onerror=null;">
                    <div class="info"><div class="name">${photo.name}</div><div class="loc">📍 ${parseFloat(photo.latitude).toFixed(4)}, ${parseFloat(photo.longitude).toFixed(4)}</div></div>
                </div>
            `).join('');
            window._gpsPhotos = gpsPhotos;
        }

        function focusMapPhoto(i) {
            const p = window._gpsPhotos[i];
            if (!p || !leafletMap) return;
            leafletMap.setView([parseFloat(p.latitude), parseFloat(p.longitude)], 15);
            leafletMarkers[i]?.openPopup();
            highlightMapItem(i);
        }

        function highlightMapItem(i) {
            document.querySelectorAll('.map-photo-card').forEach(c => c.classList.remove('selected'));
            const el = document.getElementById('mcard-'+i);
            if (el) { el.classList.add('selected'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        }

        function openModal(index) {
            currentModalIndex = index;
            document.getElementById('photoModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            showModalPhoto();
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateModal(dir) {
            currentModalIndex += dir;
            if (currentModalIndex < 0) currentModalIndex = allPhotos.length - 1;
            if (currentModalIndex >= allPhotos.length) currentModalIndex = 0;
            showModalPhoto();
        }

        function showModalPhoto() {
            const photo = allPhotos[currentModalIndex];
            if (!photo) return;
            document.getElementById('modalImage').src = `/images/${photo.id}`;
            document.getElementById('modalCounter').textContent = `${currentModalIndex+1} / ${allPhotos.length}`;

            const gpsLink = photo.latitude ? `https://www.google.com/maps?q=${photo.latitude},${photo.longitude}` : '';

            document.getElementById('modalSidebar').innerHTML = `
                <h3>Photo Details</h3>
                <button onclick="hideFolderOf(currentModalIndex)" style="margin-bottom:0.5rem;padding:0.3rem 0.6rem;background:rgba(255,255,255,0.08);color:#ddd;border:1px solid #555;border-radius:4px;cursor:pointer;">隱藏此資料夾</button>
                <div class="modal-meta-row"><span class="label">Name</span><span class="value" title="${photo.path||''}">${photo.name}</span></div>
                <div class="modal-meta-row"><span class="label">Dimensions</span><span class="value">${photo.width||0} × ${photo.height||0}</span></div>
                <div class="modal-meta-row"><span class="label">Size</span><span class="value">${formatBytes(photo.size)}</span></div>
                ${photo.format?`<div class="modal-meta-row"><span class="label">Format</span><span class="value">${photo.format}</span></div>`:''}
                ${photo.camera_make?`<div class="modal-meta-row"><span class="label">Camera</span><span class="value">${photo.camera_make} ${photo.camera_model||''}</span></div>`:''}
                ${photo.lens_model?`<div class="modal-meta-row"><span class="label">Lens</span><span class="value">${photo.lens_model}</span></div>`:''}
                ${photo.iso?`<div class="modal-meta-row"><span class="label">ISO</span><span class="value">${photo.iso}</span></div>`:''}
                ${photo.aperture?`<div class="modal-meta-row"><span class="label">Aperture</span><span class="value">f/${photo.aperture}</span></div>`:''}
                ${photo.shutter_speed?`<div class="modal-meta-row"><span class="label">Shutter</span><span class="value">${photo.shutter_speed}s</span></div>`:''}
                ${photo.focal_length?`<div class="modal-meta-row"><span class="label">Focal Length</span><span class="value">${photo.focal_length}mm</span></div>`:''}
                ${photo.flash?`<div class="modal-meta-row"><span class="label">Flash</span><span class="value">${photo.flash}</span></div>`:''}
                <div class="modal-meta-row"><span class="label">Date Taken</span><span class="value">${formatDate(photo.date_taken)}</span></div>
                ${photo.latitude?`<div class="modal-meta-row"><span class="label">GPS</span><span class="value"><a href="${gpsLink}" target="_blank" style="color:#667eea;">${parseFloat(photo.latitude).toFixed(6)}, ${parseFloat(photo.longitude).toFixed(6)}</a></span></div>`:''}
                ${photo.altitude?`<div class="modal-meta-row"><span class="label">Altitude</span><span class="value">${photo.altitude}m</span></div>`:''}
                ${photo.software?`<div class="modal-meta-row"><span class="label">Software</span><span class="value">${photo.software}</span></div>`:''}
                ${photo.artist?`<div class="modal-meta-row"><span class="label">Artist</span><span class="value">${photo.artist}</span></div>`:''}
                ${photo.copyright?`<div class="modal-meta-row"><span class="label">Copyright</span><span class="value">${photo.copyright}</span></div>`:''}
                ${photo.hash?`<div class="modal-meta-row"><span class="label">Hash</span><span class="value" style="font-size:0.7rem;">${photo.hash.substring(0,16)}...</span></div>`:''}
                <div class="modal-meta-row"><span class="label">Path</span><span class="value" style="font-size:0.7rem;">${photo.path||'N/A'}</span></div>
                <div class="modal-meta-row"><span class="label">Embedding</span><span class="value">${photo.hasEmbedding?(photo.embedScore!=null?'Yes · score '+Number(photo.embedScore).toFixed(4):'Yes'):'No'}</span></div>
                ${(photo.tags&&photo.tags.length)?`<div class="modal-meta-row"><span class="label">Tags</span><span class="value">${photo.tags.map(t=>t.label+(t.score!=null?' ('+Number(t.score).toFixed(2)+')':'')).join(' · ')}</span></div>`:(photo.category?`<div class="modal-meta-row"><span class="label">Tags</span><span class="value">${photo.category}${photo.category2?' · '+photo.category2:''}</span></div>`:'')}
                <div id="modalFaces" style="margin-top:0.75rem;"></div>
                <button class="modal-delete" onclick="deletePhoto(${photo.id}, ${currentModalIndex})">🗑 Delete Photo</button>
            `;

            // Load faces for this photo
            loadPhotoFaces(photo.id);
        }

        async function deletePhoto(id, index) {
            if (!confirm('Delete this photo permanently from disk and database?')) return;
            try {
                const res = await authFetch('/api/photos/'+id, { method: 'DELETE' });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                allPhotos.splice(index, 1);
                allPhotosData = allPhotosData.filter(p => p.id !== id);
                document.getElementById('totalPhotos').textContent = allPhotos.length;
                if (allPhotos.length === 0) { closeModal(); renderGrid(true); return; }
                if (currentModalIndex >= allPhotos.length) currentModalIndex = allPhotos.length - 1;
                showModalPhoto();
                renderGrid(true);
            } catch (err) { alert('Delete failed: '+err.message); }
        }

        async function deleteAllDuplicates() {
            const dups = allPhotosData.filter(p => p.is_duplicate);
            if (dups.length === 0) return alert('No duplicate photos found.');
            if (!confirm(`Delete ALL ${dups.length} duplicate photos permanently?`)) return;
            let deleted = 0, errors = 0;
            for (const p of dups) {
                try {
                    const res = await authFetch('/api/photos/'+p.id, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) deleted++; else errors++;
                } catch (_) { errors++; }
            }
            allPhotosData = allPhotosData.filter(p => !p.is_duplicate);
            allPhotos = document.getElementById('hideDuplicates').checked ? allPhotosData : allPhotosData;
            document.getElementById('totalPhotos').textContent = allPhotos.length;
            document.getElementById('hiddenCount').textContent = '0';
            renderGrid(true);
            alert(`Done: ${deleted} duplicates deleted, ${errors} errors`);
        }

        function backupAllFiltered() {}

        document.addEventListener('keydown', e => {
            if (document.getElementById('photoModal').classList.contains('active')) {
                if (e.key==='Escape') closeModal();
                if (e.key==='ArrowLeft') navigateModal(-1);
                if (e.key==='ArrowRight') navigateModal(1);
            }
        });

        document.getElementById('searchInput').addEventListener('input', () => { clearTimeout(searchTimeout); searchTimeout = setTimeout(loadPhotos, 300); });

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                if (currentView === 'map') renderMapView();
                else { if (leafletMap) { leafletMap.remove(); leafletMap = null; } renderGrid(true); }
            });
        });

        // Face support functions
        async function loadPhotoFaces(fileId) {
            const container = document.getElementById('modalFaces');
            if (!container) return;
            try {
                const token = localStorage.getItem('silverfs_token');
                const res = await fetch('/api/faces/by-file/' + fileId, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const faces = data.faces || [];
                if (faces.length === 0) {
                    container.innerHTML = '<div style="font-size:0.75rem;color:#666;margin-top:0.5rem;">No faces detected</div>';
                    return;
                }
                container.innerHTML = `
                    <div style="font-size:0.8rem;color:#888;margin-bottom:0.3rem;border-top:1px solid #2a2a2a;padding-top:0.5rem;">
                        👥 Detected Faces (${faces.length})
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:0.4rem;">
                        ${faces.map(f => `
                            <div title="${f.group_label || 'Unnamed'}\nGender: ${f.gender || '?'}\nAge: ${f.age || '?'}\nConfidence: ${f.confidence}\n${f.has_glasses ? 'Glasses: Yes' : ''}"
                                 style="position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid ${f.group_label ? '#667eea' : '#444'};cursor:pointer;"
                                 onclick="window.open('/faces','_blank')">
                                ${f.thumb ? '<img src="data:image/jpeg;base64,' + f.thumb + '" style="width:100%;height:100%;object-fit:cover;">' : '<div style="width:100%;height:100%;background:#333;"></div>'}
                                <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.75);font-size:0.5rem;text-align:center;color:white;padding:1px 2px;">
                                    ${f.group_label || (f.gender || '?') + ' ' + (f.age || '?')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                container.innerHTML = '';
            }
        }

        async function loadFaceFilter() {
            try {
                const token = localStorage.getItem('silverfs_token');
                const res = await fetch('/api/faces/named-list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const sel = document.getElementById('faceFilter');
                if (sel && data.groups) {
                    sel.innerHTML = '<option value="">All Faces</option>' +
                        data.groups.map(g => `<option value="${g.id}">${g.label} (${g.face_count})</option>`).join('') +
                        '<option value="none">No Faces</option>' +
                        '<option value="ignored">Ignored Faces</option>';
                }
            } catch (e) {}
        }

                async function loadTagOptions() {
            try {
                const res = await authFetch('/api/embed/categories');
                const data = await res.json();
                const sel = document.getElementById('tagFilter');
                const cur = sel.value;
                const labels = data.labels || (data.categories || []).map(c => c.label) || [];
                sel.innerHTML = '<option value="">All Tags</option>' + labels.map(l =>
                    `<option value="${l}" ${l===cur?'selected':''}>${l}</option>`
                ).join('');
            } catch (e) {
                console.warn('tag options:', e.message);
            }
        }
        loadTagOptions();
        loadPhotos();
        loadFaceFilter();
    function saveMinSize(){ const e=document.getElementById('minSizeKB'); localStorage.setItem('photosMinSizeKB', e ? e.value : '200'); }
</script>
</body>
</html>
